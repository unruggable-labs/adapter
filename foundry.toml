[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
# Pinned rather than left to the compiler default, which tracks whatever the solc version happens to
# target and so moves under us on any bump without showing up in a diff. Prague is live on Ethereum,
# Base and Sepolia, the three chains carrying a proxy.
evm_version = "prague"
optimizer = true
optimizer_runs = 200
# `forge inspect <C> storageLayout` reads the build artifact rather than recompiling, and a warm
# cache serves artifacts built without this output, which surfaces as "Could not get storage layout".
# Upgrade validation depends on that command, so every build emits the layout.
extra_output = ["storageLayout"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/"
]
fs_permissions = [
    { access = "read-write", path = "./deployments" }
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
