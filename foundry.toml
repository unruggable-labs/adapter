[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
# Pinned rather than left to the compiler default, which tracks whatever the solc version happens to
# target and so moves under us on any bump without showing up in a diff. This records the target the
# project already compiles against, so a later change of EVM version has to be written down and
# reviewed as its own edit.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/"
]
fs_permissions = [
    { access = "read-write", path = "./deployments" }
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
